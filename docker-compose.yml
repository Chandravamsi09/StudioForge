version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: studioforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-studioforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-studioforge_secret_dev}
      POSTGRES_DB: ${DB_DATABASE:-studioforge_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-studioforge} -d ${DB_DATABASE:-studioforge_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: studioforge-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
